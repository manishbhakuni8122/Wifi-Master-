<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zippee WiFi Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root{
  --bg:#f4f6fa; --panel:#fff; --ink:#151b2b; --muted:#667085; --line:#e4e7ec; --soft:#f9fafb;
  --brand:#4f46e5; --brand-soft:#eef2ff; --side:#121826; --side-ink:#c9cfdc;
  --ok:#12b76a; --ok-soft:#e8f8f0; --warn:#f79009; --warn-soft:#fff6e6; --bad:#f04438; --bad-soft:#fef0ef;
  --info:#2e90fa; --info-soft:#eaf4ff; --grey-soft:#f2f4f7;
  --r:12px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.hidden{display:none!important}

/* ---------- login ---------- */
#login{min-height:100%;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#121826,#312e81)}
.login-card{background:#fff;border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.login-card h1{margin:0 0 4px;font-size:22px}
.login-card p{margin:0 0 20px;color:var(--muted)}

/* ---------- layout ---------- */
#app{display:flex;min-height:100%}
aside{width:228px;background:var(--side);color:var(--side-ink);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.logo{padding:20px 18px;font-weight:700;color:#fff;font-size:16px;display:flex;gap:10px;align-items:center}
.logo .dot{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;font-size:16px}
nav a{display:flex;align-items:center;gap:10px;padding:10px 18px;color:var(--side-ink);text-decoration:none;border-left:3px solid transparent;cursor:pointer}
nav a:hover{background:rgba(255,255,255,.05);color:#fff}
nav a.active{background:rgba(79,70,229,.18);color:#fff;border-left-color:var(--brand)}
nav a .ic{width:18px;text-align:center}
nav a .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
.side-foot{margin-top:auto;padding:14px 18px;font-size:12px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot button{background:none;border:1px solid rgba(255,255,255,.2);color:var(--side-ink);border-radius:8px;padding:5px 10px;cursor:pointer;margin-top:8px}
main{flex:1;min-width:0;padding:22px 26px 60px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.topbar h2{margin:0;font-size:21px;flex:1;min-width:180px}
.menu-btn{display:none}

/* ---------- filters ---------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:16px;box-shadow:var(--shadow);align-items:center}
.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:130px}
.filters .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}

/* ---------- components ---------- */
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:#fecdca}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h3{margin:0;font-size:15px;flex:1}
.card-b{padding:16px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{padding:16px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:28px;font-weight:700;margin-top:6px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)} .kpi.ok .v{color:var(--ok)}
.charts{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.chart-box{position:relative;height:280px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:#027a48}.b-warn{background:var(--warn-soft);color:#b54708}
.b-bad{background:var(--bad-soft);color:#b42318}.b-info{background:var(--info-soft);color:#175cd3}
.b-grey{background:var(--grey-soft);color:#475467}.b-brand{background:var(--brand-soft);color:#3730a3}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--soft);position:sticky;top:0;z-index:1;white-space:nowrap}
tr:hover td{background:#fafbff}
.tbl-wrap{overflow:auto;max-height:68vh}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.cred{display:inline-flex;align-items:center;gap:4px}
.icon-btn{border:none;background:none;cursor:pointer;padding:2px 4px;border-radius:4px;color:var(--muted)}
.icon-btn:hover{background:var(--grey-soft);color:var(--ink)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.row-actions{display:flex;gap:4px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* store cards */
.stores-grid{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.store-card{padding:14px;cursor:pointer;transition:.15s}
.store-card:hover{border-color:var(--brand);transform:translateY(-1px)}
.store-card .t{font-weight:600;font-size:15px}
.store-card .m{color:var(--muted);font-size:12px;margin:2px 0 10px}
.wifi-pills{display:flex;gap:6px;flex-wrap:wrap}
.wifi-pill{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 7px;background:var(--soft)}
.wifi-pill.bad{border-color:#fecdca;background:var(--bad-soft)}
.wifi-pill.warn{border-color:#fedf89;background:var(--warn-soft)}

/* connection cards in drawer */
.conn{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.conn-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.conn-h .isp{font-weight:700;font-size:15px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 16px}
.kv div .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.kv div .x{margin-top:2px;word-break:break-word}

/* drawer & modal */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);z-index:50;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(860px,100%);height:100%;overflow:auto;box-shadow:-10px 0 30px rgba(0,0,0,.2)}
.drawer-h{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;gap:10px;align-items:center;z-index:2;flex-wrap:wrap}
.drawer-h h3{margin:0;flex:1;font-size:18px;min-width:160px}
.drawer-b{padding:20px}
.modal-wrap{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:14px;width:min(720px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal-h h3{margin:0;flex:1;font-size:17px}
.modal-b{padding:18px 20px;overflow:auto}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form .full{grid-column:1/-1}
.form label{display:block;font-size:12px;font-weight:600;color:#344054;margin-bottom:4px}
.form input,.form select,.form textarea,.login-card input{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:8px 10px;background:#fff}
.form textarea{min-height:64px;resize:vertical}
.form input:focus,.form select:focus,.form textarea:focus{outline:2px solid #c7d2fe;border-color:var(--brand)}
.form .hint{font-size:11px;color:var(--muted);margin-top:3px}
.form h4{grid-column:1/-1;margin:8px 0 0;font-size:13px;color:var(--brand);border-bottom:1px solid var(--line);padding-bottom:4px}
.checklist{border:1px solid #d0d5dd;border-radius:8px;max-height:200px;overflow:auto;padding:6px}
.checklist label{display:flex;gap:8px;align-items:center;font-weight:400;padding:3px 4px;margin:0;font-size:13px}
.checklist label input{width:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:99;box-shadow:var(--shadow)}
.toast.err{background:var(--bad)}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.6);z-index:90;font-weight:600}
.split{display:flex;gap:16px;flex-wrap:wrap}
.split>*{flex:1;min-width:280px}
.pw{letter-spacing:.1em}

@media (max-width: 900px){
  aside{position:fixed;left:-240px;z-index:40;transition:.2s}
  aside.open{left:0}
  .menu-btn{display:inline-flex}
  main{padding:16px}
  .charts{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .filters select,.filters input{min-width:0;flex:1 1 140px}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<section id="login" class="hidden">
  <form class="login-card" id="loginForm">
    <h1>📶 Zippee WiFi Manager</h1>
    <p>Sign in with your team account</p>
    <div class="form" style="grid-template-columns:1fr">
      <div><label>Email</label><input id="loginEmail" type="email" required autocomplete="username"></div>
      <div><label>Password</label><input id="loginPass" type="password" required autocomplete="current-password"></div>
      <button class="btn primary" style="justify-content:center" type="submit">Sign in</button>
      <div id="loginErr" class="small" style="color:var(--bad)"></div>
    </div>
  </form>
</section>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="logo"><span class="dot">📶</span> WiFi Manager</div>
    <nav id="nav"></nav>
    <div class="side-foot"><div id="whoami"></div><button id="logoutBtn">Sign out</button></div>
  </aside>
  <main>
    <div class="topbar">
      <button class="btn menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <h2 id="pageTitle">Dashboard</h2>
      <div id="pageActions" class="row-actions"></div>
    </div>
    <div class="filters" id="filters"></div>
    <div id="page"></div>
  </main>
</div>

<div id="overlayRoot"></div>
<div id="modalRoot"></div>

<script>
/* =====================================================================
   1) CONFIG — paste your Supabase project URL and anon (public) key
   ===================================================================== */
const SUPABASE_URL      = 'https://amlmthmhswcsgxsbuhxe.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtbG10aG1oc3djc2d4c2J1aHhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3ODE4MzIsImV4cCI6MjA4ODM1NzgzMn0.k4u6EJAzTjzQqXA107KyiYyiMu7Jw1fMufJ8nrO8O-A';
const DUE_SOON_DAYS     = 3;      // same threshold as the Apps Script alert
const TZ                = 'Asia/Kolkata';
</script>
<script>
/* =====================================================================
   Zippee WiFi Manager — app logic
   ===================================================================== */
// tolerate stray spaces, quotes or a trailing slash pasted into the config
const SB_URL = String(SUPABASE_URL).trim().replace(/^['"]|['"]$/g, '').replace(/\/+$/, '');
const SB_KEY = String(SUPABASE_ANON_KEY).trim().replace(/^['"]|['"]$/g, '').replace(/\s+/g, '');
const sb = supabase.createClient(SB_URL, SB_KEY);

/* ---------------- constants ---------------- */
const LOGIN_METHODS = {
  userid_password: 'User ID + Password',
  phone_otp:       'Registered mobile + OTP',
  account_number:  'Account / DSL ID + Password',
  email_password:  'Email + Password',
  portal_other:    'Other (see notes)'
};
const CONN_STATUS = {
  active:               ['Active', 'b-ok'],
  suspended:            ['Suspended', 'b-warn'],
  disconnect_requested: ['Disconnect requested', 'b-warn'],
  disconnected:         ['Disconnected', 'b-grey'],
  shift_requested:      ['Shift requested', 'b-info'],
  inactive:             ['Inactive', 'b-grey']
};
const STORE_STATUS = { active: ['Active','b-ok'], inactive: ['Inactive','b-grey'], closed: ['Closed','b-bad'] };
const PAYMENT_TYPES = ['Recharge','New Installation','Installation + Recharge','Shifting','Data Add On','Top Up','Due Clearance','Data Recharge','Security Deposit','Other'];
const EQUIP_LOCATIONS = ['At store','In storage / warehouse','With person','Handed to ISP','Lost / Damaged'];
const EQUIP_ITEMS = ['Router','ONT / Modem','Power adapter','LAN cable','Extender / Mesh','Other'];
const EVENT_LABELS = {
  disconnect_requested: 'Disconnection requested', disconnected: 'Disconnected',
  shift_requested: 'Shifting requested', shifted: 'Shifted', reconnected: 'Reconnected / reactivated', note: 'Note'
};

/* ---------------- brand / city auto-detect (ported from your Apps Script) ---------------- */
const BRAND_MAP = {"MT":"Myntra","FNP":"FNP","ZL":"Zilo","VA":"Varee","VR":"Varee","FKM":"FKM","FKG":"FKG","CLK":"CLK","SRT":"SRT","TGS":"TGS","PTR":"PTR","SDD":"SDD","CC":"CC","ST":"ST","HK":"Healthkart","HQ":"Zippee","HLD":"HLD","MFC":"MFC","HY":"Zippee","Libas":"Libas","Epik":"Epik","H&S":"H&S","2":"Zippee","TMZ":"TMZ","AMZ":"Amazon","OZI":"Ozi","RXP":"Rxpress","HUFT":"HUFT"};
const CITY_MAP = {"malad":"Mumbai","navi mumbai":"Mumbai","marol":"Mumbai","lamington":"Mumbai","airoli":"Mumbai","andheri":"Mumbai","matunga":"Mumbai","borivali":"Mumbai","lower parel":"Mumbai","thane":"Mumbai","kharghar":"Mumbai","mira road":"Mumbai","ghatkopar":"Mumbai","penthouse":"Mumbai","chakala":"Mumbai","mumbai":"Mumbai","chembur":"Mumbai","vashi":"Mumbai","colaba":"Mumbai","bkc":"Mumbai","powai":"Mumbai","seawood":"Mumbai","kandivali":"Mumbai","yerawada":"Pune","vadgaon":"Pune","viman nagar":"Pune","pune":"Pune","gachibowli":"Hyderabad","nizampet":"Hyderabad","attapur":"Hyderabad","manikonda":"Hyderabad","nampally":"Hyderabad","hafeezpet":"Hyderabad","yelankha":"Bengaluru","banashankari":"Bengaluru","brookfield":"Bengaluru","begur":"Bengaluru","thyagraj":"Bengaluru","horamavu":"Bengaluru","kempapura":"Bengaluru","jakkur":"Bengaluru","jp nagar":"Bengaluru","hulimavu":"Bengaluru","holimavu":"Bengaluru","sarjapur":"Bengaluru","kalyan":"Bengaluru","basaveshwara":"Bengaluru","basaweshwara":"Bengaluru","koramangala":"Bengaluru","thipasandara":"Bengaluru","varthur":"Bengaluru","btm":"Bengaluru","electronic city":"Bengaluru","bommasandra":"Bengaluru","frazer town":"Bengaluru","yashwantpur":"Bengaluru","whitefield":"Bengaluru","bommanhalli":"Bengaluru","banaswadi":"Bengaluru","marathalli":"Bengaluru","rt nagar":"Bengaluru","hebbal":"Bengaluru","kr puram":"Bengaluru","vasant nagar":"Bengaluru","singsandra":"Bengaluru","kumarswamy":"Bengaluru","blr":"Bengaluru","dilshad garden":"Delhi NCR","janakpuri":"Delhi NCR","okhla":"Delhi NCR","shahpurjat":"Delhi NCR","noida":"Delhi NCR","ggn":"Delhi NCR","gurgaon":"Delhi NCR","dlf":"Delhi NCR","ghitorni":"Delhi NCR","wazirpur":"Delhi NCR","ashok vihar":"Delhi NCR","badsahpur":"Delhi NCR","satyaniketan":"Delhi NCR","lajpat":"Delhi NCR","model town":"Delhi NCR","rajouri":"Delhi NCR","karol bagh":"Delhi NCR","dwarka":"Delhi NCR","kalkaji":"Delhi NCR","faridabad":"Delhi NCR","periyamet":"Chennai","behala":"Kolkata","topsia":"Kolkata","nashik":"Nashik","nasik":"Nashik","nanpur":"Moradabad","moradabad":"Moradabad","ludhiana":"Ludhiana","jhansi road":"Ludhiana","dehradun":"Dehradun","harmada":"Jaipur","kalmaserry":"Kerala","kulathoor":"Kerala","palluruthy":"Kerala","ayyanthole":"Kerala","chembukav":"Kerala","pattom":"Kerala","palarivattom":"Kerala","poojapura":"Kerala","vadodara":"Vadodara"};
function detectBrand(name){
  const s = String(name||'').trim(); if(!s) return '';
  const after = s.replace(/^ZD\s+/i,''); if(after === s) return 'Zippee';
  for (const code of Object.keys(BRAND_MAP)){
    if (after.substring(0,code.length).toUpperCase() === code.toUpperCase()){
      const nx = after.charAt(code.length); if (nx === '' || nx === ' ') return BRAND_MAP[code];
    }
  }
  return 'Zippee';
}
function detectCity(name){
  const s = String(name||'').toLowerCase();
  for (const k of Object.keys(CITY_MAP).sort((a,b)=>b.length-a.length)) if (s.includes(k)) return CITY_MAP[k];
  return '';
}

/* ---------------- state ---------------- */
const S = {
  user: null, page: 'dashboard',
  stores: [], conns: [], payments: [], equipment: [], events: [], isps: [], methods: [],
  f: { brand:'', city:'', store:'', isp:'', status:'active', q:'' },
  charts: [], tab: {}, recon: null
};

/* ---------------- utils ---------------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = v => v == null || v === '' ? '—' : '₹' + Number(v).toLocaleString('en-IN', {maximumFractionDigits: 0});
const todayISO = () => new Intl.DateTimeFormat('en-CA', {timeZone: TZ}).format(new Date());
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return Date.UTC(y, m-1, d); };
const daysBetween = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const fmtD = s => s ? s.split('-').reverse().join('-') : '—';
const fmtDot = s => s ? s.split('-').reverse().join('.') : '';
const addMonths = (iso, m) => { const [y,mo,d] = iso.split('-').map(Number); const t = new Date(Date.UTC(y, mo-1+m, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth()+1, 0)).getUTCDate();
  t.setUTCDate(Math.min(d, last)); return t.toISOString().slice(0,10); };
const uniq = a => [...new Set(a.filter(x => x != null && x !== ''))].sort((x,y)=>String(x).localeCompare(String(y)));
const byId = (arr, id) => arr.find(x => x.id === id);
function toast(msg, err){ const t = document.createElement('div'); t.className = 'toast' + (err?' err':''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), err ? 5000 : 2500); }
function loading(on){ let el = $('#loadingEl'); if(on && !el){ el = document.createElement('div'); el.id='loadingEl'; el.className='loading'; el.textContent='Loading…'; document.body.appendChild(el);} if(!on && el) el.remove(); }
function badge(map, k){ const v = map[k] || [k, 'b-grey']; return `<span class="badge ${v[1]}">${esc(v[0])}</span>`; }

/* due status for a connection */
function dueInfo(c){
  if (!c.next_due) return { state:'none', days:null, html:'<span class="badge b-grey">No tenure set</span>' };
  const days = daysBetween(todayISO(), c.next_due);
  if (days < 0)  return { state:'overdue', days, html:`<span class="badge b-bad">Overdue ${-days}d</span>` };
  if (days <= DUE_SOON_DAYS) return { state:'soon', days, html:`<span class="badge b-warn">${days===0?'Due today':'Due in '+days+'d'}</span>` };
  return { state:'ok', days, html:`<span class="badge b-ok">${days}d left</span>` };
}
const isLive = c => ['active','suspended','shift_requested'].includes(c.status);

/* ---------------- data ---------------- */
async function fetchAll(table, order){
  const out = []; const size = 1000;
  for (let from = 0; ; from += size){
    let q = sb.from(table).select('*').range(from, from + size - 1);
    if (order) q = q.order(order[0], {ascending: order[1]});
    const { data, error } = await q; if (error) throw error;
    out.push(...data); if (data.length < size) break;
  }
  return out;
}
async function loadAll(){
  loading(true);
  try{
    const [stores, conns, payments, equipment, events, isps, methods] = await Promise.all([
      fetchAll('wifi_stores', ['name', true]), fetchAll('wifi_v_connections', ['id', true]),
      fetchAll('wifi_payments', ['payment_date', false]), fetchAll('wifi_equipment', ['id', true]),
      fetchAll('wifi_connection_events', ['event_date', false]), fetchAll('wifi_isps', ['name', true]),
      fetchAll('wifi_payment_methods', ['sort_order', true])]);
    Object.assign(S, {stores, conns, payments, equipment, events, isps, methods});
  } catch(e){ toast('Load failed: ' + e.message, true); console.error(e); }
  loading(false);
}
async function dbWrite(promise, okMsg){
  const { data, error } = await promise;
  if (error){ toast(error.message, true); throw error; }
  if (okMsg) toast(okMsg);
  return data;
}

/* ---------------- filters ---------------- */
function storeOf(c){ return byId(S.stores, c.store_id) || {}; }
function connPass(c, f = S.f){
  if (f.brand && c.brand !== f.brand) return false;
  if (f.city && c.city !== f.city) return false;
  if (f.store && String(c.store_id) !== f.store) return false;
  if (f.isp && c.isp !== f.isp) return false;
  if (f.status === 'active' && !isLive(c)) return false;
  if (f.status && f.status !== 'active' && f.status !== 'all' && c.status !== f.status) return false;
  if (f.q){
    const hay = [c.store_name, c.isp, c.account_no, c.login_id, c.registered_phone, c.registered_name, c.registered_email, c.label, c.notes].join(' ').toLowerCase();
    if (!hay.includes(f.q.toLowerCase())) return false;
  }
  return true;
}
function storePass(s, f = S.f){
  if (f.brand && s.brand !== f.brand) return false;
  if (f.city && s.city !== f.city) return false;
  if (f.store && String(s.id) !== f.store) return false;
  if (f.q && !(s.name + ' ' + (s.address||'')).toLowerCase().includes(f.q.toLowerCase())
      && !S.conns.some(c => c.store_id === s.id && connPass(c, {q: f.q, status: 'all'}))) return false;
  if (f.isp && !S.conns.some(c => c.store_id === s.id && c.isp === f.isp)) return false;
  return true;
}
function paymentStore(p){ return byId(S.stores, p.store_id) || (p.connection_id ? storeOf(byId(S.conns, p.connection_id) || {}) : {}); }
function paymentPass(p, f = S.f){
  const st = paymentStore(p); const c = byId(S.conns, p.connection_id);
  const brand = p.brand || st.brand || 'Zippee';
  if (f.brand && brand !== f.brand) return false;
  if (f.city && st.city !== f.city) return false;
  if (f.store && String(st.id) !== f.store) return false;
  if (f.isp && (!c || c.isp !== f.isp)) return false;
  if (f.q){ const hay = [st.name, c?.isp, p.particulars, p.reference, p.remarks, p.payment_method].join(' ').toLowerCase(); if (!hay.includes(f.q.toLowerCase())) return false; }
  return true;
}

function renderFilters(){
  const el = $('#filters');
  const show = ['dashboard','stores','connections','renewals','payments'].includes(S.page);
  el.classList.toggle('hidden', !show); if (!show) return;
  const brands = uniq(S.stores.map(s => s.brand));
  const cities = uniq(S.stores.map(s => s.city));
  const storesF = S.stores.filter(s => (!S.f.brand || s.brand === S.f.brand) && (!S.f.city || s.city === S.f.city));
  const isps = uniq(S.conns.map(c => c.isp));
  const opt = (v, cur, label) => `<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(label ?? v)}</option>`;
  const statusSel = S.page === 'payments' ? '' : `<select data-f="status">
      ${opt('active', S.f.status, 'Live WiFi only')}${opt('all', S.f.status, 'All statuses')}
      ${Object.entries(CONN_STATUS).map(([k,v]) => opt(k, S.f.status, v[0])).join('')}</select>`;
  el.innerHTML = `<span class="lbl">Filter</span>
    <select data-f="brand"><option value="">All brands</option>${brands.map(b => opt(b, S.f.brand)).join('')}</select>
    <select data-f="city"><option value="">All cities</option>${cities.map(b => opt(b, S.f.city)).join('')}</select>
    <select data-f="store" style="min-width:200px"><option value="">All stores (${storesF.length})</option>${storesF.map(s => opt(s.id, S.f.store, s.name)).join('')}</select>
    <select data-f="isp"><option value="">All ISPs</option>${isps.map(b => opt(b, S.f.isp)).join('')}</select>
    ${statusSel}
    <input data-f="q" placeholder="Search store, DSL ID, phone…" value="${esc(S.f.q)}" style="flex:1;min-width:180px">
    <button class="btn sm ghost" id="clearF">Clear</button>`;
  el.querySelectorAll('[data-f]').forEach(inp => {
    const ev = inp.tagName === 'INPUT' ? 'input' : 'change';
    inp.addEventListener(ev, () => {
      S.f[inp.dataset.f] = inp.value;

      if (inp.tagName === 'INPUT'){ clearTimeout(inp._t); inp._t = setTimeout(() => renderPage(true), 200); }
      else render();

  });

}

function sheetName(m){ return (S.methods.find(x => x.name === m)?.recon_sheet_name || m).replace(/[\\/?*\[\]:]/g, '').slice(0, 31); }
function reconRows(r){
  return S.payments.filter(p => p.payment_date >= r.from && p.payment_date <= r.to && r.methods.includes(p.payment_method))
    .sort((a,b) => a.payment_date.localeCompare(b.payment_date) || a.id - b.id)
    .map(p => { const c = byId(S.conns, p.connection_id); const st = paymentStore(p);
      const particulars = p.particulars || [st.name, c?.isp, p.payment_type].filter(Boolean).join(' ');
      return { date: fmtDot(p.payment_date), entity: p.brand || st.brand || 'Zippee', particulars, amount: Number(p.amount), method: p.payment_method }; });
}
async function downloadRecon(r, rows){
  if (!r.methods.length) return toast('Pick at least one tab', true);
  const wb = new ExcelJS.Workbook();
  const font = { name: 'Arial', size: 10 }, bold = { ...font, bold: true };
  const thin = { style: 'thin' }, border = { top: thin, left: thin, bottom: thin, right: thin };
  const green = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8F5E9' } };
  for (const m of r.methods){
    const list = rows.filter(x => x.method === m);
    const ws = wb.addWorksheet(sheetName(m));
    ws.columns = [{width:12.63},{width:10.13},{width:50.13},{width:5.13},{width:10.13},{width:11},{width:7.63},{width:10.13}];
    ws.getRow(1).values = ['Wifi']; ws.mergeCells('A1:H1');
    ws.getRow(2).values = ['Date','Entity','Particulars','Qty','Price','Amount'];
    list.forEach((x, i) => { const rn = i + 3; const row = ws.getRow(rn);
      row.values = [x.date, x.entity, x.particulars, 1, x.amount, { formula: `D${rn}*E${rn}`, result: x.amount }]; });
    const totalRow = list.length + 3;
    ws.getRow(totalRow).values = ['Total Amount', null, null, null, null, list.length ? { formula: `SUM(F3:F${totalRow - 1})`, result: list.reduce((a,x)=>a+x.amount,0) } : 0];
    ws.mergeCells(`A${totalRow}:B${totalRow}`);
    for (let rn = 1; rn <= totalRow; rn++) for (let cn = 1; cn <= 8; cn++){
      const cell = ws.getCell(rn, cn); cell.border = border; cell.font = (rn <= 2 || rn === totalRow) && cn !== 3 ? bold : font;
      if (rn <= 2 || (rn === totalRow && cn <= 2)) cell.alignment = { horizontal: 'center' };
      if (rn > 2 && cn === 5) cell.numFmt = '"₹" #,##0';
      if (rn > 2 && cn === 6){ cell.numFmt = '"₹"#,##0'; if (rn < totalRow) cell.fill = green; }
    }
  }
  const buf = await wb.xlsx.writeBuffer();
  const mon = new Date(r.to + 'T00:00:00').toLocaleDateString('en-IN', { month: 'long', year: '2-digit' });
  saveBlob(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), `Credit Card Recon ${mon} Statement (${fmtD(r.from)} to ${fmtD(r.to)}).xlsx`);
}
function saveBlob(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }
async function downloadSheet(rows, sheet, name){
  const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet(sheet);
  const cols = rows.length ? Object.keys(rows[0]) : ['No data'];
  ws.columns = cols.map(k => ({ header: k, key: k, width: Math.min(45, Math.max(10, k.length + 2, ...rows.map(r => String(r[k] ?? '').length + 1))) }));
  rows.forEach(r => ws.addRow(r)); ws.getRow(1).font = { bold: true }; ws.views = [{ state: 'frozen', ySplit: 1 }];
  saveBlob(new Blob([await wb.xlsx.writeBuffer()]), name);
}

/* =====================================================================
   GENERIC MODAL FORM
   ===================================================================== */
function modal({ title, fields, values = {}, onSave, onDelete, saveLabel = 'Save', extraHtml = '', onMount }){
  const v = k => values[k] ?? '';
  const fieldHtml = f => {
    if (f.section) return `<h4>${esc(f.section)}</h4>`;
    const id = 'f_' + f.k; const cls = f.full ? 'full' : '';
    let input;
    if (f.type === 'select') input = `<select id="${id}" ${f.required?'required':''}>${f.blank !== false ? `<option value="">${esc(f.blank || '—')}</option>` : ''}${f.options.map(o => { const [val, lab] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(val)}" ${String(val) === String(v(f.k)) ? 'selected' : ''}>${esc(lab)}</option>`; }).join('')}</select>`;
    else if (f.type === 'textarea') input = `<textarea id="${id}">${esc(v(f.k))}</textarea>`;
    else if (f.type === 'checkbox') input = `<label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="${id}" style="width:auto" ${v(f.k) ? 'checked' : ''}> ${esc(f.cbLabel || '')}</label>`;
    else if (f.type === 'html') input = f.html;
    else input = `<input id="${id}" type="${f.type || 'text'}" value="${esc(v(f.k))}" ${f.required?'required':''} ${f.step ? `step="${f.step}"` : ''} ${f.list ? `list="${id}_l"` : ''} autocomplete="off">${f.list ? `<datalist id="${id}_l">${f.list.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}`;
    return `<div class="${cls}">${f.type === 'checkbox' ? '' : `<label>${esc(f.label)}${f.required ? ' *' : ''}</label>`}${input}${f.hint ? `<div class="hint">${f.hint}</div>` : ''}</div>`;
  };
  $('#modalRoot').innerHTML = `<div class="modal-wrap"><form class="modal" id="mForm" novalidate>
    <div class="modal-h"><h3>${esc(title)}</h3><button type="button" class="btn sm ghost" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><div class="form">${fields.map(fieldHtml).join('')}</div>${extraHtml}</div>
    <div class="modal-f">${onDelete ? '<button type="button" class="btn danger" id="mDel" style="margin-right:auto">Delete</button>' : ''}
      <button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit" id="mSave">${esc(saveLabel)}</button></div>
  </form></div>`;
  const read = () => { const out = {}; fields.filter(f => f.k && f.type !== 'html').forEach(f => { const el = $('#f_' + f.k);
    let val = f.type === 'checkbox' ? el.checked : el.value.trim();
    if (f.type === 'number') val = val === '' ? null : Number(val);
    else if (f.type !== 'checkbox' && val === '') val = null;
    out[f.k] = val; }); return out; };
  $('#mForm').onsubmit = async e => { e.preventDefault();
    const data = read();
    const miss = fields.find(f => f.required && (data[f.k] === null || data[f.k] === ''));
    if (miss) return toast(miss.label + ' is required', true);
    $('#mSave').disabled = true;
    try { await onSave(data); closeModal(); } catch(err){ console.error(err); } finally { const b = $('#mSave'); if (b) b.disabled = false; } };
  if (onDelete) $('#mDel').onclick = async () => { if (!confirm('Delete permanently?')) return; try { await onDelete(); closeModal(); } catch(e){} };
  if (onMount) onMount();
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }
async function afterSave(){ await loadAll(); renderNav(); renderPage(); reopenDrawer(); }

  const i = name ? S.isps.find(x => x.name === name) : { login_method: 'userid_password' };
  modal({ title: name ? 'Edit ISP' : 'Add ISP', values: i,
    fields: [{ k: 'name', label: 'ISP name', required: true }, { k: 'login_method', label: 'Default login method', type: 'select', blank: false, options: Object.entries(LOGIN_METHODS) },
      { k: 'portal_url', label: 'Self-care portal URL', full: true }, { k: 'support_phone', label: 'Support / sales contact' }, { k: 'notes', label: 'Notes', type: 'textarea', full: true }],
    onSave: async d => { if (name) await dbWrite(sb.from('wifi_isps').update(d).eq('name', name), 'ISP updated'); else await dbWrite(sb.from('wifi_isps').insert(d), 'ISP added'); await afterSave(); },
    onDelete: name ? async () => { await dbWrite(sb.from('wifi_isps').delete().eq('name', name), 'ISP deleted'); await afterSave(); } : null });
}
function openMethod(name){
  const m = name ? S.methods.find(x => x.name === name) : { include_in_recon: true, sort_order: 10 };
  modal({ title: name ? 'Edit payment method' : 'Add payment method', values: m,
    fields: [{ k: 'name', label: 'Method name', required: true }, { k: 'recon_sheet_name', label: 'Recon tab name', hint: 'Max 31 characters' },
      { k: 'include_in_recon', type: 'checkbox', cbLabel: 'Include in recon export by default' }, { k: 'sort_order', label: 'Sort order', type: 'number' }],
    onSave: async d => { if (name) await dbWrite(sb.from('wifi_payment_methods').update(d).eq('name', name), 'Updated'); else await dbWrite(sb.from('wifi_payment_methods').insert(d), 'Added');
      S.recon = null; await afterSave(); },
    onDelete: name ? async () => { await dbWrite(sb.from('wifi_payment_methods').delete().eq('name', name), 'Deleted'); await afterSave(); } : null });
}

/* =====================================================================
   AUTH & BOOT
   ===================================================================== */
async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session){ $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); return; }
  S.user = session.user;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#whoami').textContent = S.user.email;
  await loadAll(); render();
}
$('#loginForm').onsubmit = async e => { e.preventDefault(); $('#loginErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#loginEmail').value.trim(), password: $('#loginPass').value });
  if (!error) return boot();
  if (/fetch|network/i.test(error.message)){
    const health = `${SB_URL}/auth/v1/health?apikey=${SB_KEY}`;
    $('#loginErr').innerHTML = `Can't reach Supabase at <b>${esc(SB_URL)}</b>. This isn't a password problem.<br>
      <a href="${esc(health)}" target="_blank" rel="noopener">Click here to test the connection</a>. If that page doesn't open, your network or ISP is blocking supabase.co.
      Try mobile data, a VPN or DNS 1.1.1.1. If it shows text starting <code>{"version"</code>, check the URL in CONFIG.`;
  } else $('#loginErr').textContent = error.message; };
$('#logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ if ($('#modalRoot').innerHTML) closeModal(); else closeDrawer(); } });
if (SUPABASE_URL.includes('YOUR-PROJECT')) document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif"><h2>Almost there</h2><p>Open <code>index.html</code> in a text editor and paste your Supabase URL and anon key into the CONFIG block near the bottom.</p></div>';
else boot();

</script>
</body>
</html>
